<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B7285" />
    <meta name="description" content="مدیریت انبار و فروشگاه محصولات پلاستیکی" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="پلاسکو" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>پلاسکو منیجینگ</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: Tahoma, sans-serif; direction: rtl; padding: 1rem">
        برای اجرای این اپ باید JavaScript در مرورگر فعال باشد.
      </p>
    </noscript>
    <!-- file-open-notice:start -->
    <!-- Browsers refuse to run a module bundle from file:// (opaque origin, CORS),
         so a double-clicked file would stay blank. Show instructions instead.
         scripts/build-preview.mjs strips this whole block from preview.html. -->
    <script>
      (function () {
        if (location.protocol !== 'file:') return;
        window.setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;
          root.innerHTML =
            '<div style="max-width:34rem;margin:3rem auto;padding:1.5rem;border:1px solid #cbd5e1;border-radius:1rem;font-family:Tahoma,\'Segoe UI\',sans-serif;line-height:2;direction:rtl;text-align:right;color:#0f172a">' +
            '<h1 style="font-size:1.3rem;margin:0 0 .75rem">این فایل خودِ برنامه نیست</h1>' +
            '<p style="margin:0 0 .75rem">مرورگر نمی‌گذارد برنامه از روی فایل‌های خود کامپیوتر باز شود، پس صفحه سفید می‌ماند. نگران نباش؛ کارت راه دارد.</p>' +
            '<p style="margin:0 0 .75rem"><b>باز کردن با یک دوبار کلیک روی همین کامپیوتر:</b> در پوشه‌ی پروژه فایل <code>start-site.bat</code> را دوبار کلیک کن؛ خودش اپ را می‌سازد و در مرورگر باز می‌کند. (اگر دستی ساختی، فایل <code>dist/preview.html</code> را باز کن.)</p>' +
            '<p style="margin:0"><b>برای گوشی‌ها:</b> برنامه از یک آدرس اینترنتی باز می‌شود؛ آدرس آماده در بخش «شروع سریع» فایل <code>README.md</code> نوشته شده است.</p>' +
            '</div>';
        }, 700);
      })();
    </script>
    <!-- file-open-notice:end -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
